<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>เอกสาร</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
 :root{--w:190mm}
 @page{size:A4 portrait;margin:10mm}
 body{font-family:Prompt,sans-serif;background:#e2e8f0;margin:0;color:#111;}
 .bar{position:sticky;top:0;z-index:5;background:#312e81;padding:10px;display:flex;gap:8px;flex-wrap:wrap}
 .bar button{border:0;border-radius:10px;padding:8px 14px;font-family:inherit;cursor:pointer;background:#fff}
 .page{background:#fff;width:var(--w);margin:14px auto;padding:10mm;box-shadow:0 2px 10px #0003}
 .head{text-align:center;margin-bottom:10px} .school{font-size:16pt;font-weight:600} .addr{font-size:9.5pt;color:#555}
 .head h2{margin:6px 0 2px;font-size:14pt} .sub{font-size:10.5pt}
 .info{display:flex;flex-wrap:wrap;gap:4px 24px;font-size:10.5pt;margin:8px 0}
 table.r{width:100%;border-collapse:collapse;font-size:10pt}
 table.r th,table.r td{border:1px solid #333;padding:3px 5px;text-align:center}
 table.r th{background:#eef2ff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 table.r td.l{text-align:left} tr.b td{font-weight:600;background:#f1f5f9;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 table.r.blank td{height:8.5mm}
 .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px;text-align:center;font-size:10.5pt}
 .exporting .page{width:var(--w);padding:0;margin:0;box-shadow:none}
 @media print{ body{background:#fff;zoom:1} .bar{display:none} .page{width:auto;margin:0;padding:0;box-shadow:none;break-after:page} .page:last-child{break-after:auto} }
 
</style></head><body>
<div class="bar"><button onclick="window.print()">🖨️ พิมพ์</button><button onclick="pdf()">📄 ดาวน์โหลด PDF</button>
 <button onclick="xl()">📗 Excel</button><button onclick="word()">📘 Word</button><button onclick="window.close();history.back()">✖ ปิด</button></div>
<div id="docs">

</div>
<script src="demo_docs.js"></script>
<script>
(function(){
 const k=new URLSearchParams(location.search).get('k')||'', D=(window.DEMO_DOCS||{})[k], S=window.DEMO_SCH;
 const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 let h='';
 if(!D){h='<div class="page"><p style="text-align:center">ไม่พบเอกสารนี้ในเว็บตัวอย่าง</p></div>';}
 else{window.DOC_TITLE=D.t;document.title=D.t;
  D.pages.forEach(p=>{
   h+='<div class="page"><div class="head"><div class="school">'+e(S.name)+'</div><div class="addr">'+e(S.address)+'</div><h2>'+e(p.title)+'</h2><div class="sub">'+e(p.sub)+' · ปีการศึกษา '+e(S.year)+' ภาคเรียนที่ '+e(S.term)+'</div></div>';
   if(p.info)h+='<div class="info">'+p.info.map(x=>'<span><b>'+e(x[0])+':</b> '+e(x[1])+'</span>').join('')+'</div>';
   if(p.head&&p.head.length){
    h+='<table class="r '+(p.blank?'blank':'')+'"><thead><tr>'+p.head.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr></thead><tbody>';
    p.rows.forEach((r,i)=>{h+='<tr class="'+((p.bold||[]).includes(i)?'b':'')+'">'+r.map((c,j)=>'<td class="'+((p.left||[]).includes(j)?'l':'')+'">'+e(c)+'</td>').join('')+'</tr>';});
    if(!p.rows.length)h+='<tr><td colspan="'+p.head.length+'">ไม่มีข้อมูล</td></tr>';
    h+='</tbody></table>';
   }else h+='<p style="text-align:center">ไม่พบข้อมูลสำหรับสร้างเอกสารนี้</p>';
   h+='<div class="sign"><div>ลงชื่อ ...........................................<br>('+e(S.teacher)+')<br>ครูผู้สอน / ผู้จัดทำ</div><div>ลงชื่อ ...........................................<br>('+e(S.registrar)+')<br>หัวหน้างานวิชาการ</div><div>ลงชื่อ ...........................................<br>('+e(S.principal)+')<br>ผู้อำนวยการโรงเรียน</div></div></div>';
  });}
 document.getElementById('docs').innerHTML=h;
})();
</script>
<script>
const TITLE=window.DOC_TITLE||'เอกสาร'; let ORIENT='portrait';
// อ่านตัวเลือกจากท้าย URL (orient / sign / preview) — ใช้ตอนเปิดเป็นเว็บตัวอย่างแบบ static ด้วย
(function(){const q=new URLSearchParams(location.search);
 if(q.get('orient')==='landscape'){ORIENT='landscape';document.documentElement.style.setProperty('--w','277mm');
  const st=document.createElement('style');st.textContent='@page{size:A4 landscape;margin:10mm}';document.head.appendChild(st);}
 if(q.get('sign')==='0')document.querySelectorAll('.sign').forEach(e=>e.style.display='none');
 if(q.get('preview')){document.querySelector('.bar').style.display='none';document.body.style.zoom=(ORIENT==='landscape'?.42:.6);}})();
function pdf(){document.body.classList.add('exporting');
 html2pdf().set({margin:10,filename:TITLE+'.pdf',html2canvas:{scale:2},pagebreak:{mode:['css'],after:'.page'},
  jsPDF:{unit:'mm',format:'a4',orientation:ORIENT}}).from(document.getElementById('docs')).save()
  .then(()=>document.body.classList.remove('exporting'));}
function xl(){const wb=XLSX.utils.book_new();
 document.querySelectorAll('#docs table').forEach((t,i)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.table_to_sheet(t),'หน้า'+(i+1)));
 if(!wb.SheetNames.length){alert('ไม่มีตารางให้ส่งออก');return;} XLSX.writeFile(wb,TITLE+'.xlsx');}
function word(){const st='<style>table{border-collapse:collapse;font-family:Tahoma}td,th{border:1px solid #000;padding:3px;text-align:center}.head{text-align:center}</style>';
 const h='<html><head><meta charset="utf-8">'+st+'</head><body>'+document.getElementById('docs').innerHTML+'</body></html>';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+h],{type:'application/msword'}));a.download=TITLE+'.doc';a.click();}
</script></body></html>
